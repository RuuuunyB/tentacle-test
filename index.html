<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나에게 어울리는 반려 촉수 테스트</title>
<meta property="og:title" content="나에게 어울리는 반려 촉수 테스트">
<meta property="og:description" content="10개의 질문으로 알아보는 나의 반려 촉수. 이름과 예상 MBTI까지!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0ff;--ink:#2f2445;--pt:#ff6b8b;--y:#ffd15c;--h:340}
*{box-sizing:border-box;margin:0}
body{background-color:var(--bg);background-image:radial-gradient(#dcd0ff 2px,transparent 2.6px);background-size:24px 24px;color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:26px 16px 56px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,.jua,.btn,.badge,.stick{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.hide{display:none!important}

/* 상단 제작자 링크 & 언어 선택 바 스타일 */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 0.82rem;
}
.creator-link {
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  border-bottom: 1px dashed var(--ink);
  opacity: 0.8;
  transition: opacity 0.2s;
}
.creator-link:hover { opacity: 1; }
.lang-select {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 3px 6px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  outline: none;
}

.card{background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink)}
.pet svg{width:200px;height:250px;display:block;margin:0 auto;overflow:visible}
.sway{transform-box:fill-box;transform-origin:50% 92%;animation:sway 3.6s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#start{text-align:center;margin:auto 0}
.stage{position:relative;width:240px;margin:0 auto}
.bubble{position:absolute;right:-14px;top:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;font-family:"Jua",sans-serif;font-size:1rem;transform:rotate(5deg);z-index:2}
.bubble:after{content:"";position:absolute;left:12px;bottom:-10px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(40deg) skew(10deg)}
#start h1{font-size:2.4rem;line-height:1.2;margin:10px 0 8px}
#start p{margin-bottom:20px;color:#6b5a8e;font-size:0.95rem}
.btn{background:var(--pt);color:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px 24px;font-size:1.15rem;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;text-decoration:none;display:inline-block;text-align:center;}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.tags span,.chip{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:0.82rem;font-weight:600}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count{font-family:"Jua",sans-serif;font-size:1.05rem;white-space:nowrap}
.bar{flex:1;height:14px;background:#fff;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pt);transition:width .3s}
.q{padding:24px 18px 18px;position:relative;margin-bottom:18px}
.badge{position:absolute;top:-14px;left:16px;background:var(--y);border:2.5px solid var(--ink);border-radius:10px;padding:0 12px;font-size:1rem}
#qtext{font-size:1.35rem;line-height:1.4;min-height:3.8rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:13px 16px;font-size:0.96rem;font-weight:500;box-shadow:2.5px 2.5px 0 var(--ink);transition:transform .1s,background .15s}
.opt:nth-child(1):hover{background:#ffe3ed}.opt:nth-child(2):hover{background:#e1f2ff}.opt:nth-child(3):hover{background:#fff3cc}.opt:nth-child(4):hover{background:#e2f7ea}
.opt:hover{transform:translate(-2px,-2px)}
.opt.on{background:var(--y)!important;transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
#result{text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
.rcard{padding:16px 16px 20px;background:hsl(var(--h) 90% 93%)}
.rcard .pet svg{width:180px;height:220px}
.kind{font-size:0.9rem;font-weight:600;color:#6b5a8e}
#rt{font-size:1.8rem;line-height:1.25;margin:2px 0 4px}
#rq{font-size:0.9rem;font-weight:600;color:#6b5a8e;margin-bottom:12px}
.stick{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 14px;font-size:1.1rem;transform:rotate(-1deg)}
.stick b{font-size:1.6rem;letter-spacing:0.08em;margin-left:6px;font-weight:400}
.box{padding:14px 16px;margin-top:14px;text-align:left}
.box h3{font-family:"Jua",sans-serif;font-weight:400;font-size:1rem;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:"Jua",sans-serif;font-weight:400;font-size:1.05rem;padding:3px 14px}
.chip:nth-child(1){background:#ffd6e4}.chip:nth-child(2){background:#d3efff}.chip:nth-child(3){background:#fff3b0}
.row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;font-size:0.9rem}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sway,.eye,#result{animation:none}.btn,.opt{transition:none}}
</style>
</head>
<body>
<main>
<!-- 상단 제작자 링크 & 언어 선택 -->
<div class="top-bar">
  <a href="https://caveduck.io/ko/user/RunnyBunny" target="_blank" class="creator-link" id="txt-creator">by RunnyBunny</a>
  <select id="lang-select" class="lang-select" onchange="changeLang(this.value)">
    <option value="ko" selected>한국어</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="zh">中文 (简体)</option>
    <option value="tw">中文 (繁體)</option>
    <option value="es">Español</option>
  </select>
</div>

<section id="start">
<div class="stage"><div class="bubble" id="bubble-txt">데려갈래?</div><div class="pet" id="hero"></div></div>
<h1 id="title-txt">반려 촉수<br>성향 진단 테스트</h1>
<p id="desc-txt">화분 속에서 자라난 나만의 촉수 취향을 알아보세요.</p>
<button class="btn" id="go">테스트 시작하기</button>
<div class="tags" id="tags-txt"><span>10문항</span><span>결과 16종</span><span>맞춤 이름·MBTI</span></div>
</section>

<section id="quiz" class="hide">
<div class="top"><span class="count" id="cnt"></span><div class="bar"><i id="bar"></i></div></div>
<div class="card q"><span class="badge" id="qn"></span><h2 id="qtext"></h2></div>
<div class="opts" id="opts"></div>
</section>

<section id="result" class="hide" aria-live="polite">
<div class="card rcard">
<div class="pet" id="rpet"></div>
<div class="kind" id="res-kind-txt">당신의 반려 촉수는</div>
<h1 id="rt"></h1>
<div id="rq"></div>
<div class="stick"><span id="mbti-label">예상 MBTI</span><b id="rm"></b></div>
</div>
<div class="card box"><h3 id="res-box1-title">이런 촉수예요</h3><div id="rd"></div></div>
<div class="card box"><h3 id="res-box2-title">이 촉수의 특기</h3><div id="rs"></div></div>
<div class="card box"><h3 id="res-box3-title">추천 이름</h3><div class="chips" id="rn"></div></div>
<div class="row">
  <a class="btn" href="https://ko.cvdk.io/c/1pW9SCLORf-PhbbKEJAMYA?rc=B59S5dTqhB" target="_blank" id="btn-grow">반려 촉수 키우러 가기</a>
  <button class="btn alt" id="share">결과 공유</button>
  <button class="btn alt" id="again">다시 하기</button>
</div>
</section>
</main>
<div id="toast" role="status"></div>

<script>

let currentLang = "ko";
let i=0, ans=[], cur="ISFP";

const $=id=>document.getElementById(id);

// 언어 변경 함수
function changeLang(lang) {
  currentLang = lang;
  const t = I18N[lang];
  
  // 시작 화면 반영
  $("bubble-txt").textContent = t.bubble;
  $("title-txt").innerHTML = t.title;
  $("desc-txt").textContent = t.desc;
  $("go").textContent = t.goBtn;
  
  const tagsEl = $("tags-txt");
  tagsEl.innerHTML = `<span>${t.tags[0]}</span><span>${t.tags[1]}</span><span>${t.tags[2]}</span>`;
  
  // 결과 화면 공통 반영
  $("res-kind-txt").textContent = t.resKind;
  $("mbti-label").textContent = t.mbtiLabel;
  $("res-box1-title").textContent = t.box1;
  $("res-box2-title").textContent = t.box2;
  $("res-box3-title").textContent = t.box3;
  $("btn-grow").textContent = t.btnGrow;
  $("share").textContent = t.shareBtn;
  $("again").textContent = t.againBtn;

  // 퀴즈 진행 중일 경우 현재 문항 갱신
  if (!$("#quiz").classList.contains("hide")) {
    render();
  } else if (!$("#result").classList.contains("hide")) {
    finish(); // 결과 화면 내용 재번역
  }
}

const show=id=>["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const heroPet=()=>$("hero").innerHTML=pet(rnd([340,200,270,150,30]),rnd(KINDS));

function render(){
  const Q = I18N[currentLang].q;
  const [,txt,op]=Q[i];
  $("cnt").textContent=(i+1)+" / "+Q.length;
  $("qn").textContent="Q"+(i+1);
  $("bar").style.width=((i+1)/Q.length*100)+"%";
  $("qtext").textContent=txt;
  const box=$("opts");box.innerHTML="";
  op.forEach(([t,v])=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{b.classList.add("on");setTimeout(()=>pick(v),200)};
    box.appendChild(b);
  });
}

function pick(v){
  const Q = I18N[currentLang].q;
  ans.push([Q[i][0],v]);
  i++;
  i<Q.length?render():finish();
}

function finish(){
  const sc={};ans.forEach(([,v])=>sc[v]=(sc[v]||0)+1);
  cur=["EI","SN","TF","JP"].map(p=>(sc[p[0]]||0)>=(sc[p[1]]||0)?p[0]:p[1]).join("");
  const langData = I18N[currentLang];
  const rLang = langData.r[cur];
  const namesList = langData.names[cur];
  const rBase = R_base[cur]; // 색상 고정값
  
  document.documentElement.style.setProperty("--h",rBase.h);
  $("rt").textContent=rLang.t;
  $("rq").textContent="“"+rLang.q+"”";
  $("rm").textContent=cur;
  $("rd").textContent=rLang.d;
  $("rs").textContent=rLang.s;
  $("rn").innerHTML=namesList.map(n=>'<span class="chip">'+n+'</span>').join("");
  drawResult();show("result");window.scrollTo(0,0);
}

function drawResult(){
  const rBase = R_base[cur];
  $("rpet").innerHTML=pet(rBase.h,ACC[cur]);
}

    hearts:'<text x="100" y="212" font-size="24" text-anchor="middle" fill="#fff" opacity=".85">♥</text>'}[pat];
  const sp=`<text x="30" y="${50+Math.random()*30}" font-size="18" fill="#ffd54a" stroke="${PL}" stroke-width="0.8">✦</text><text x="165" y="${110+Math.random()*30}" font-size="15" fill="#ff9ec0" stroke="${PL}" stroke-width="0.8">✦</text>`;
  return `<svg viewBox="0 0 200 250" role="img" aria-label="화분에 심어진 귀여운 촉수">${sp}
  <ellipse cx="100" cy="240" rx="50" ry="6.5" fill="${PL}" opacity=".15"/>
  <defs><clipPath id="${id}"><rect x="0" y="${ey+46}" width="200" height="140"/></clipPath></defs>
  <g class="sway"><path d="${d}" fill="none" stroke="${PL}" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" fill="none" stroke="${body}" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" fill="none" stroke="hsl(${h} 100% 90%)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 16" clip-path="url(#${id})"/>
  <ellipse cx="${fx-15}" cy="${fy+7}" rx="5" ry="3" fill="#ff7fa5" opacity=".5"/><ellipse cx="${fx+15}" cy="${fy+7}" rx="5" ry="3" fill="#ff7fa5" opacity=".5"/>
  ${E(fx-9)}${E(fx+9)}${M}${acc(k,ex,ey,fx,fy)}</g>
  <path d="M60 178 L68 228 Q69 233 75 233 L125 233 Q131 233 132 228 L140 178z" fill="${pc}" stroke="${PL}" stroke-width="3.5" stroke-linejoin="round"/>${P}
  <rect x="52" y="160" width="96" height="22" rx="9" fill="${pc}" stroke="${PL}" stroke-width="3.5"/><path d="M64 168 H90" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg>`;
}

$("go").onclick=()=>{i=0;ans=[];show("quiz");render()};
$("again").onclick=()=>{document.documentElement.style.setProperty("--h",340);heroPet();show("start");window.scrollTo(0,0)};
$("share").onclick=async()=>{
  const langData = I18N[currentLang];
  const rLang = langData.r[cur];
  const namesList = langData.names[cur];
  const t = langData;
  const text=`${t.resKind} 「${rLang.t}」 (${cur}) — ${t.box3}: ${namesList[0]}\n`+location.href;
  try{ if(navigator.share){await navigator.share({title:"반려 촉수 테스트",text});return} await navigator.clipboard.writeText(text);toast(t.toastCopy) }catch(e){toast(t.toastCancel)}
};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
heroPet();
</script>
